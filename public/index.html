<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청소년아지트 뮤니버스 [방명록 등록]</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
        }
        input, select, textarea { /* textarea 추가 */
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit; /* 폰트 상속 */
            font-size: 1rem; /* 폰트 크기 통일 */
        }
        
        /* ▼▼▼ 이 부분 추가 ▼▼▼ */
        textarea {
            resize: none;
        }
        /* ▲▲▲ 여기까지 추가 ▲▲▲ */

        button {
            width: 100%;
            padding: 0.8rem;
            background-color: #0c9bfa;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #0073c4;
        }
        #message {
            margin-top: 1rem;
            text-align: center;
            font-weight: bold;
        }
        .admin-link {
            display: block;
            text-align: right;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h11>뮤니버스 입장 </h1>
        <form id="registrationForm">
            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="number">연락처</label>
                <input type="tel" id="number" placeholder="010-1234-5678" required>
            </div>
            <div class="form-group">
                <label for="gender">성별</label>
                <select id="gender" required>
                    <option value="">성별 선택</option>
                    <option value="남성">남성</option>
                    <option value="여성">여성</option>
                </select>
            </div>
            <div class="form-group">
                <label for="age">나이</label>
                <input type="number" id="age" placeholder="8세 ~ 24세 사이의 숫자 입력" required>
            </div>
            <div class="form-group">
                <label for="region">지역</label>
                <input type="text" id="region" placeholder="거주 지역 (예: 양천구)" required>
            </div>
            <div class="form-group">
                <label for="suggestion">뮤니버스에서 생겼으면 하는 놀거리는?</label>
                <textarea id="suggestion" rows="3" placeholder="자유롭게 적어주세요!"></textarea>
            </div>
            <button type="submit">등록하기</button>
        </form>
        <div id="message"></div>
        <a href="/admin.html" class="admin-link">관리자 페이지로 이동 &rarr;</a>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const messageDiv = document.getElementById('message');
        const API_URL = 'https://festival-backend-zika.onrender.com';

        const phoneInput = document.getElementById('number');
        phoneInput.addEventListener('input', (event) => {
            const value = phoneInput.value.replace(/\D/g, '');
            let formattedValue = value;
            if (value.length > 3 && value.length <= 7) {
                formattedValue = `${value.slice(0, 3)}-${value.slice(3)}`;
            } else if (value.length > 7) {
                formattedValue = `${value.slice(0, 3)}-${value.slice(3, 7)}-${value.slice(7, 11)}`;
            }
            phoneInput.value = formattedValue;
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const number = document.getElementById('number').value;
            const gender = document.getElementById('gender').value;
            const age = document.getElementById('age').value;
            const region = document.getElementById('region').value;
            const suggestion = document.getElementById('suggestion').value;

            if (!name || !number || !gender || !age || !region) {
                messageDiv.textContent = '모든 필수 항목을 입력해주세요.';
                return;
            }

            const ageNumber = parseInt(age, 10);
            if (ageNumber < 8 || ageNumber > 24) {
                messageDiv.textContent = '나이는 8세부터 24세까지만 등록 가능합니다.';
                return;
            }

            try {
                messageDiv.textContent = '등록 중...';
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, number, gender, age, region, suggestion })
                });

                const result = await response.json();

                if (response.ok) {
                    messageDiv.textContent = '🎉 등록이 완료되었습니다!';
                    form.reset();
                } else {
                    throw new Error(result.message || '등록에 실패했습니다.');
                }

            } catch (error) {
                messageDiv.textContent = '오류: ' + error.message;
            }
        });
    </script>
</body>
</html>
